<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSFS Companion Bridge — Test Client</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 700px; width: 100%; }
    h1 { color: #00d4ff; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 1.5rem; }
    .status {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-weight: bold;
    }
    .status.connected    { background: #0d3320; color: #4caf50; }
    .status.disconnected { background: #3b1515; color: #f44336; }
    .status.connecting   { background: #3b3015; color: #ff9800; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 1rem;
    }
    .card .label { font-size: 0.8rem; color: #888; text-transform: uppercase; }
    .card .value { font-size: 1.6rem; color: #00d4ff; margin-top: 0.25rem; }
    .card .unit  { font-size: 0.75rem; color: #666; }
    #log {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Consolas', monospace;
      font-size: 0.8rem;
      color: #8b949e;
    }
    #log div { margin-bottom: 2px; }
    button {
      background: #0f3460;
      color: #00d4ff;
      border: 1px solid #00d4ff;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    button:hover { background: #1a4a7a; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MSFS Companion Bridge</h1>
    <p class="subtitle">WebSocket Telemetry Test Client</p>

    <button id="connectBtn" onclick="toggleConnection()">Connect</button>

    <div id="statusBar" class="status disconnected">Disconnected</div>

    <div class="grid">
      <div class="card">
        <div class="label">Latitude</div>
        <div class="value" id="lat">—</div>
        <div class="unit">degrees</div>
      </div>
      <div class="card">
        <div class="label">Longitude</div>
        <div class="value" id="lon">—</div>
        <div class="unit">degrees</div>
      </div>
      <div class="card">
        <div class="label">Altitude</div>
        <div class="value" id="alt">—</div>
        <div class="unit">feet</div>
      </div>
      <div class="card">
        <div class="label">Heading</div>
        <div class="value" id="heading">—</div>
        <div class="unit">degrees true</div>
      </div>
      <div class="card">
        <div class="label">Airspeed</div>
        <div class="value" id="speed">—</div>
        <div class="unit">knots</div>
      </div>
      <div class="card">
        <div class="label">Vertical Speed</div>
        <div class="value" id="vs">—</div>
        <div class="unit">ft/min</div>
      </div>
      <div class="card">
        <div class="label">Pitch</div>
        <div class="value" id="pitch">—</div>
        <div class="unit">degrees</div>
      </div>
      <div class="card">
        <div class="label">Bank</div>
        <div class="value" id="bank">—</div>
        <div class="unit">degrees</div>
      </div>
    </div>

    <h3 style="margin-bottom:0.5rem; color:#888;">Event Log</h3>
    <div id="log"></div>
  </div>

  <script>
    let ws = null;

    function toggleConnection() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      } else {
        connect();
      }
    }

    function connect() {
      setStatus("connecting", "Connecting...");
      log("Connecting to ws://localhost:8765 ...");

      ws = new WebSocket("ws://localhost:8765");

      ws.onopen = () => {
        setStatus("connected", "Connected");
        log("Connected to MSFS Companion Bridge");
        document.getElementById("connectBtn").textContent = "Disconnect";
      };

      ws.onmessage = (event) => {
        try {
          const d = JSON.parse(event.data);
          document.getElementById("lat").textContent     = d.lat.toFixed(4);
          document.getElementById("lon").textContent     = d.lon.toFixed(4);
          document.getElementById("alt").textContent     = d.alt.toFixed(0);
          document.getElementById("heading").textContent = d.heading.toFixed(1);
          document.getElementById("speed").textContent   = d.speed.toFixed(1);
          document.getElementById("vs").textContent      = d.vs.toFixed(0);
          document.getElementById("pitch").textContent   = d.pitch.toFixed(2);
          document.getElementById("bank").textContent    = d.bank.toFixed(2);
        } catch (e) {
          log("Error parsing message: " + e.message);
        }
      };

      ws.onclose = () => {
        setStatus("disconnected", "Disconnected");
        log("Connection closed");
        document.getElementById("connectBtn").textContent = "Connect";
        ws = null;
      };

      ws.onerror = (err) => {
        log("WebSocket error occurred");
      };
    }

    function setStatus(cls, text) {
      const el = document.getElementById("statusBar");
      el.className = "status " + cls;
      el.textContent = text;
    }

    function log(msg) {
      const el = document.getElementById("log");
      const ts = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      div.textContent = "[" + ts + "] " + msg;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }
  </script>
</body>
</html>
